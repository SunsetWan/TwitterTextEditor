name: check-commit

on:
  - push
  - pull_request

jobs:
  check-commit:
    runs-on: macos-15

    steps:
      - name: Use Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Create iOS 18.5 simulator
        run: |
          # Initializing CoreSimulator explicitly avoids a hosted-runner race where
          # xcodebuild sees only the generic simulator destination.
          xcrun simctl list runtimes | grep -F "iOS 18.5"
          simulator_id="$(xcrun simctl create \
            "TwitterTextEditor-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro" \
            "com.apple.CoreSimulator.SimRuntime.iOS-18-5")"
          echo "TEST_DEVICE_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Install SwiftLint
        run: |
          archive="$RUNNER_TEMP/portable_swiftlint.zip"
          install_directory="$RUNNER_TEMP/swiftlint"
          curl --fail --location --silent --show-error \
            https://github.com/realm/SwiftLint/releases/download/0.59.1/portable_swiftlint.zip \
            --output "$archive"
          echo "58f9be8a4677900c945e2c618168223f4dd620a0cc65c9ccc5ea0f70433e89c1  $archive" \
            | shasum -a 256 --check
          unzip -q "$archive" -d "$install_directory"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$install_directory/swiftlint" "$HOME/.local/bin/swiftlint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Current platform versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          swiftlint version

      - name: Checkout default branch
        uses: actions/checkout@v7

      - name: Run lint
        run: |
          make lint

      - name: Run test
        run: |
          make test TEST_DESTINATION="platform=iOS Simulator,id=$TEST_DEVICE_ID"

      - name: Run doc
        run: |
          make doc
